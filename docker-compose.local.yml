services:
  postgres-local:
    image: postgres:16
    container_name: ludo-postgres-local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ludo_local
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ludo_local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
